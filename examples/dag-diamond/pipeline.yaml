# dag-diamond — the smallest pipeline that is NOT a line.
#
#            ┌──► left ──┐
#   ingest ──┤           ├──► merge
#            └──► right ─┘
#
# Exercises both M1 features at once:
#   * BROADCAST FAN-OUT at `ingest` (out-degree 2): every event is copied to
#     both branches, so the collector must receive exactly 2 × sent.
#   * FAN-IN at `merge` (in-degree 2): one input queue fed by two upstream
#     stages, and an EOS barrier that only finishes after BOTH branches
#     deliver their marker.
#
# Note the counts are exact, not approximate: 2× is the conservation
# assertion, and any leak or duplicate shows up as a mismatch.
#
# Run:  tests/no_leak_dag.sh   (from repo root; iterates edge transports)

package: epico:dagdiamond@1.0.0

nodes:
  - name: local
    host: 127.0.0.1
    force_tcp: false

# One record type everywhere so every edge type-checks.
types:
  msg:
    sensor_id: string
    value:     f64

source:
  kind: loadgen
  profile: pulse
  count: 40000
  pulse_events: 10000
  pulse_idle_s: 3.0
  sensors: 100

stages:
  - name: ingest
    placement: local
    in:  msg
    out: msg
    src: ./stages/ingest.rs
    scaling: { min: 0, max: 3, queue_up: 20, queue_down: 0, cooldown_up_s: 0.05, cooldown_down_s: 1.0 }

  - name: left
    placement: local
    in:  msg
    out: msg
    src: ./stages/left.rs
    scaling: { min: 0, max: 3, queue_up: 20, queue_down: 0, cooldown_up_s: 0.05, cooldown_down_s: 1.0 }

  - name: right
    placement: local
    in:  msg
    out: msg
    src: ./stages/right.rs
    scaling: { min: 0, max: 3, queue_up: 20, queue_down: 0, cooldown_up_s: 0.05, cooldown_down_s: 1.0 }

  - name: merge
    placement: local
    in:  msg
    out: msg
    src: ./stages/merge.rs
    scaling: { min: 0, max: 3, queue_up: 20, queue_down: 0, cooldown_up_s: 0.05, cooldown_down_s: 1.0 }

edges:
  - ingest -> left
  - ingest -> right
  - left  -> merge
  - right -> merge

deploy:
  host: localhost
  this_host: local
  ingress: ipc:///tmp/epico-dagdiamond-push
  source_format: json
  event_format:  json

  ingress_mode: inprocess
  edge_impl: spsc
  spsc_ring_cap: 512

  credit_window: 16
  batch_events:  1
  resource_sample_interval_ms: 0
