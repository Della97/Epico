package: metapod:sensor-eval@0.1.0

nodes:
  - name: local
    host: 127.0.0.1
    force_tcp: false

types:
  sensor-sample:
    sensor_id: string
    ts_ns: u64
    value: f64

  filtered:
    sensor_id: string
    ts_ns: u64
    value: f64
    raw: f64
    clamped: bool

  featured:
    sensor_id: string
    ts_ns: u64
    value: f64
    rms: f64
    centroid: f64
    flatness: f64
    kurtosis: f64
    window_full: bool

  signed:
    sensor_id: string
    ts_ns: u64
    rms: f64
    centroid: f64
    flatness: f64
    kurtosis: f64
    content_hash: string   # blake3 hex
    hmac: string           # hmac-sha256 hex


# source:
#   kind: loadgen
#   rate: 500
#   duration: 180
#   profile: steady
#   sensors: 50

source:
  kind: loadgen
  profile: tp
  count: 1000000

stages:
  - name: denoise
    in: sensor-sample
    out: filtered
    src: ./stages/denoise.rs
    scaling:
      min: 0
      max: 1
      queue_up: 50
      cooldown_up_s: 20
      cooldown_down_s: 20
    # no extra deps — pure std

  - name: featurize
    in: filtered
    out: featured
    src: ./stages/featurize.rs
    scaling:
      min: 0
      max: 1
      queue_up: 50
      cooldown_up_s: 20
      cooldown_down_s: 20
    deps:
      rustfft: { version: "6", default-features: false }

  - name: attest
    in: featured
    out: signed
    src: ./stages/attest.rs
    scaling:
      min: 0
      max: 1
      queue_up: 50
      cooldown_up_s: 20
      cooldown_down_s: 20
    deps:
      hmac: "0.12"
      sha2: "0.10"
      blake3: { version: "1", default-features: false }
      hex: "0.4"

edges:
  - denoise -> featurize
  - featurize -> attest

deploy:
  ingress: ipc:///tmp/metapod-dispatch-denoise-push
  collector: tcp://localhost:9999
  credit_window: 16
  port_base: 9100
  host: localhost
  this_host: local
  resource_sample_interval_ms: 0