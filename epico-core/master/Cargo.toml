[package]
name = "master"
version.workspace = true
edition.workspace = true

[lib]
name = "epico_master"
path = "src/master.rs"

[[bin]]
name = "master"
path = "src/main.rs"

[features]
# ON BY DEFAULT. `cold-start-opt` selects the pooling allocator, CoW memory
# init, Cranelift Speed opt level and parallel compilation — the configuration
# a real deployment wants.
#
# It used to be opt-in, which meant the generated per-pipeline agent could never
# get it: the agent's manifest never requested the feature, so the
# `--cold-start-opt` flag only ever affected `target/release/master` — a binary
# `epico run` does not execute. The flag was silently a no-op.
#
# To build the BASELINE arm instead (every optimization off, for the cold-start
# decomposition figures) use `epico build --no-cold-start-opt` / `epico run
# --no-cold-start-opt`, which makes codegen emit `default-features = false` on
# the agent's dependency on this crate.
default = ["cold-start-opt"]
cold-start-opt = []
profile = ["dep:pprof"]

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.35", features = ["full", "sync"] }
zmq = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

# Profiling
pprof = { version = "0.13", features = ["flamegraph"], optional = true }

# Serialization and Parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
bytes = "1"

# Embedded WebAssembly Engine — Component Model (Wasmtime 26)
# Dynamic dispatch via Val — no bindgen! needed.
wasmtime = { version = "26", features = ["component-model"] }
wasmtime-wasi = "26"
wasmtime-wasi-http = "26"

# Component-type introspection for load-time pipeline validation.
wasmparser = "0.218"
anyhow = "1"
epico-logger = { path = "../logger" }

# Shared binary event-envelope wire format (single source of truth, also used
# by epico-loadgen). Zero-dependency; defines magic/version, scalar tags,
# header + field codec, and the reader.
epico-wire = { path = "../../epico-wire" }

# Process CPU + RSS sampling for the run summary. Cross-platform
# (Linux/macOS/Windows); refresh cost is negligible at 1 Hz.
sysinfo = "0.30"

# MPMC
crossbeam-queue = "0.3"
